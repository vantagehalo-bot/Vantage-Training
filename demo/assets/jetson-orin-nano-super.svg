<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140" role="img" aria-label="Jetson Orin Nano Super developer kit">
  <defs>
    <linearGradient id="pcb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f2321"/><stop offset="1" stop-color="#141716"/></linearGradient>
    <linearGradient id="sink" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a3d40"/><stop offset="1" stop-color="#17191b"/></linearGradient>
    <radialGradient id="fan" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#2b2e31"/><stop offset="1" stop-color="#0d0e0f"/></radialGradient>
    <linearGradient id="port" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d7dadd"/><stop offset="1" stop-color="#8d9297"/></linearGradient>
